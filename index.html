<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet"/>
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet"/>
<meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet"/>
<title>Zun Florist — Mother's Day Gift Maison</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Noto+Serif+JP:wght@300;400;500;600&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #F6F3EE;
    --bg-elevated: #FFFFFF;
    --bg-inverse: #0E0E0E;
    --fg: #0E0E0E;
    --fg-muted: #6B6760;
    --fg-inverse: #F6F3EE;
    --line: #E3DED5;
    --line-strong: #1A1A1A;
    --accent: #A8864B;
    --accent-ink: #826634;
    --surface-tint: #EFEAE0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    background: var(--bg);
    color: var(--fg);
    font-size: 14px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  select, textarea, input, button { font-family: inherit; }
  textarea:focus, input:focus, select:focus { outline: 1px solid var(--fg); outline-offset: -1px; }
  ::selection { background: var(--fg); color: var(--bg); }
  /* Tweaks panel */
  .tweaks-panel {
    position: fixed;
    right: 24px;
    bottom: 24px;
    background: var(--bg-elevated);
    border: 1px solid var(--line);
    padding: 20px;
    width: 260px;
    z-index: 100;
    box-shadow: 0 20px 60px rgba(0,0,0,.12);
    display: none;
  }
  .tweaks-panel.active { display: block; }
  .tweaks-title {
    font-size: 10px;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--fg);
    margin: 0 0 14px;
    display: flex;
    justify-content: space-between;
  }
  .tweak-group { margin-bottom: 14px; }
  .tweak-label {
    font-size: 10px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--fg-muted);
    margin-bottom: 8px;
  }
  .tweak-options {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }
  .tweak-option {
    padding: 10px 8px;
    border: 1px solid var(--line);
    background: var(--bg);
    font-size: 11px;
    letter-spacing: .06em;
    text-align: center;
    cursor: pointer;
    color: var(--fg);
  }
  .tweak-option.active {
    background: var(--fg);
    color: var(--fg-inverse);
    border-color: var(--fg);
  }

  /* ==================================================
     Mobile header primitives (hidden on desktop)
     ================================================== */
  .mobile-only { display: none; }

  .mobile-drawer-backdrop {
    position: fixed; inset: 0;
    background: rgba(14,14,14,.45);
    z-index: 90;
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s ease;
  }
  .mobile-drawer-backdrop.open {
    opacity: 1;
    pointer-events: auto;
  }
  .mobile-drawer {
    position: fixed; top: 0; left: 0; bottom: 0;
    width: 84%;
    max-width: 360px;
    background: var(--bg);
    z-index: 95;
    transform: translateX(-100%);
    transition: transform .32s cubic-bezier(.2,.7,.2,1);
    display: flex; flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,.18);
  }
  .mobile-drawer.open { transform: translateX(0); }
  .mobile-drawer-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 18px 20px;
    border-bottom: 1px solid var(--line);
  }
  .mobile-drawer-nav {
    padding: 8px 0;
    flex: 1;
    overflow-y: auto;
  }
  .mobile-drawer-nav a {
    display: block;
    padding: 16px 22px;
    font-size: 15px;
    letter-spacing: .06em;
    color: var(--fg);
    text-decoration: none;
    border-bottom: 1px solid var(--line);
  }
  .icon-btn {
    background: transparent;
    border: none;
    padding: 8px;
    cursor: pointer;
    color: var(--fg);
    font-family: inherit;
    display: inline-flex; align-items: center; justify-content: center;
    line-height: 1;
  }

  /* ==================================================
     Mobile responsive (≤768px) — overrides inline styles
     ================================================== */
  @media (max-width: 768px) {
    .mobile-only { display: flex !important; }
    .desktop-only { display: none !important; }

    /* HEADER */
    .announce-bar {
      padding: 7px 14px !important;
      font-size: 9.5px !important;
      letter-spacing: .08em !important;
      gap: 10px !important;
    }
    .announce-bar > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .header-main {
      grid-template-columns: auto 1fr auto !important;
      padding: 12px 14px !important;
      gap: 10px !important;
    }
    .header-logo-link { justify-self: center; }
    .header-logo-wordmark { font-size: 17px !important; }
    .header-logo-wordmark > span:last-child { display: none; }

    /* HERO */
    .hero-section {
      padding: 0 !important;
      min-height: calc(100vh - 110px) !important;
      background-position: 72% center !important;
      align-items: stretch !important;
    }
    .card-hero {
      background-image: url("assets/card_m.jpg") !important;
      background-size: cover !important;
      background-position: center !important;
    }
    .delivery-hero {
      background-image: url("assets/Delivery_m.jpg") !important;
      background-size: cover !important;
      background-position: center !important;
    }
    .hero-overlay {
      background: linear-gradient(180deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,.25) 40%, rgba(0,0,0,.1) 70%, rgba(0,0,0,.35) 100%) !important;
    }
    .hero-inner {
      padding: 36px 22px 40px !important;
      display: flex; flex-direction: column; justify-content: flex-start;
    }
    .hero-eyebrow { margin-bottom: 20px !important; font-size: 10px !important; }
    .hero-title {
      font-size: 22px !important;
      line-height: 1.45 !important;
      white-space: normal !important;
      margin: 0 0 24px !important;
      max-width: none !important;
    }
    .hero-copy {
      font-size: 12.5px !important;
      line-height: 2.0 !important;
      max-width: none !important;
    }

    /* TRUST STRIP */
    .trust-strip { padding: 16px 14px !important; }
    .trust-strip-grid {
      grid-template-columns: repeat(2, 1fr) !important;
      gap: 10px 14px !important;
      font-size: 11px !important;
    }

    /* GIFTBOX PACKING */
    .giftbox-packing { padding: 32px 20px !important; }

    /* FILTER + GRID */
    .filter-section { padding: 40px 16px 16px !important; }
    .filter-header {
      flex-direction: column !important;
      align-items: flex-start !important;
      gap: 18px !important;
      margin-bottom: 24px !important;
    }
    .filter-title { font-size: 26px !important; }
    .filter-chips {
      flex-wrap: wrap !important;
      gap: 6px !important;
    }
    .product-grid-section { padding: 0 16px 60px !important; }
    .product-grid {
      grid-template-columns: 1fr !important;
      gap: 36px !important;
    }
    .product-card-title { font-size: 18px !important; }
    /* Always-visible CTA on mobile since :hover doesn't fire on touch */
    .product-cta-overlay {
      transform: translateY(0) !important;
    }

    /* EDITORIAL BAND */
    .editorial-band { padding: 64px 22px !important; }
    .editorial-grid {
      grid-template-columns: 1fr !important;
      gap: 36px !important;
    }
    .editorial-title { font-size: 28px !important; line-height: 1.25 !important; }
    .editorial-copy { font-size: 13.5px !important; line-height: 1.9 !important; }

    /* DETAIL */
    .detail-breadcrumb { padding: 18px 16px 0 !important; font-size: 10px !important; }
    .detail-main { padding: 24px 16px 48px !important; }
    .detail-main-grid {
      grid-template-columns: 1fr !important;
      gap: 32px !important;
    }
    .detail-info { position: static !important; }
    .detail-title { font-size: 30px !important; line-height: 1.2 !important; }
    .detail-price-main { font-size: 30px !important; }
    .detail-description-section { padding: 64px 20px !important; }
    .detail-description-grid {
      grid-template-columns: 1fr !important;
      gap: 24px !important;
    }
    .detail-description-title { font-size: 24px !important; }
    .related-section { padding: 64px 16px 20px !important; }
    .related-grid {
      grid-template-columns: 1fr !important;
      gap: 40px !important;
    }
    .detail-cta-row {
      flex-direction: row !important;
      flex-wrap: wrap !important;
    }
    .detail-cta-row > div:last-child { flex-basis: 100%; }

    /* CART */
    .cart-main { padding: 24px 16px 60px !important; }
    .cart-layout {
      grid-template-columns: 1fr !important;
      gap: 32px !important;
    }
    .cart-summary {
      position: static !important;
      padding: 26px !important;
    }
    .cart-title { font-size: 28px !important; }
    .cart-item {
      grid-template-columns: 90px 1fr !important;
      gap: 16px !important;
    }
    .cart-item-price {
      grid-column: 1 / -1 !important;
      text-align: right !important;
      font-size: 18px !important;
    }
    .cart-item-name { font-size: 17px !important; }
    .checkout-progress {
      gap: 8px !important;
      padding-bottom: 20px !important;
      overflow-x: auto !important;
      -webkit-overflow-scrolling: touch;
    }
    .checkout-progress > div {
      flex: 0 0 auto !important;
      font-size: 10px !important;
      min-width: 85px;
    }

    /* CONFIRM */
    .confirm-main { padding: 24px 16px 60px !important; }
    .confirm-hero { padding: 48px 0 40px !important; }
    .confirm-title { font-size: 32px !important; line-height: 1.2 !important; }
    .confirm-meta-row {
      flex-direction: column !important;
      gap: 10px !important;
      font-size: 11px !important;
    }
    .confirm-summary {
      grid-template-columns: 1fr !important;
      padding: 28px !important;
      gap: 28px !important;
    }
    .confirm-actions {
      flex-direction: column !important;
    }
    .confirm-editorial {
      margin-top: 72px !important;
      padding: 56px 22px !important;
    }
    .confirm-editorial-text { font-size: 22px !important; }

    /* MY PAGE / CONTACT / TOKUTEI */
    .mypage-main, .contact-main, .tokutei-main { padding: 28px 20px 60px !important; }
    .mypage-title, .contact-title { font-size: 30px !important; }
    .tokutei-title { font-size: 24px !important; }
    .mypage-grid, .contact-grid {
      grid-template-columns: 1fr !important;
      gap: 32px !important;
    }
    .mypage-favs {
      grid-template-columns: 1fr 1fr !important;
      gap: 16px !important;
    }
    .mypage-order-row {
      grid-template-columns: 1fr !important;
      gap: 6px !important;
    }
    .mypage-order-row > *:last-child { text-align: left !important; }
    .tokutei-row {
      grid-template-columns: 1fr !important;
      gap: 6px !important;
      padding: 16px 0 !important;
    }
    .mypage-side { padding: 24px !important; }

    /* FLORISTS */
    .florists-hero { padding: 56px 22px 40px !important; }
    .florists-title { font-size: 28px !important; }
    .florists-lead { font-size: 13px !important; line-height: 2 !important; }
    .florists-section { padding: 48px 22px !important; }
    .florists-list { gap: 56px !important; }
    .florist-card {
      grid-template-columns: 1fr !important;
      gap: 24px !important;
      direction: ltr !important;
    }
    .florist-name { font-size: 24px !important; }

    /* FOOTER */
    .footer { padding: 48px 22px 28px !important; margin-top: 64px !important; }
    .footer-grid {
      grid-template-columns: 1fr 1fr !important;
      gap: 28px !important;
    }
    .footer-intro {
      grid-column: 1 / -1 !important;
    }
    .footer-bottom {
      flex-direction: column !important;
      gap: 10px !important;
      text-align: center !important;
      letter-spacing: .06em !important;
    }
  }
</style>
</head>
<body>
  <div id="root"></div>

  <div class="tweaks-panel" id="tweaks-panel">
    <div class="tweaks-title">
      <span>Tweaks</span>
      <span style="color:var(--fg-muted)">Palette</span>
    </div>
    <div class="tweak-group">
      <div class="tweak-label">配色</div>
      <div class="tweak-options" id="theme-options">
        <div class="tweak-option" data-theme="soft">やわらか</div>
        <div class="tweak-option active" data-theme="luxe">高級</div>
        <div class="tweak-option" data-theme="casual">カジュアル</div>
      </div>
    </div>
    <div style="font-size:10px; color:var(--fg-muted); line-height:1.6; padding-top:10px; border-top:1px solid var(--line);">
      ツールバーのTweaksボタンで開閉できます。
    </div>
  </div>

  <script>
    // Edit mode defaults
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "theme": "soft"
    }/*EDITMODE-END*/;
  </script>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="components/shared.jsx?v=10"></script>
  <script type="text/babel" src="components/list.jsx?v=29"></script>
  <script type="text/babel" src="components/detail.jsx?v=4"></script>
  <script type="text/babel" src="components/cart.jsx?v=3"></script>
  <script type="text/babel" src="components/giftbox.jsx?v=3"></script>
  <script type="text/babel" src="components/card.jsx?v=2"></script>
  <script type="text/babel" src="components/delivery.jsx?v=1"></script>
  <script type="text/babel" src="components/mypage.jsx?v=1"></script>
  <script type="text/babel" src="components/contact.jsx?v=1"></script>
  <script type="text/babel" src="components/tokutei.jsx?v=1"></script>
  <script type="text/babel" src="components/florists.jsx?v=2"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [page, setPage] = useState('list'); // list | detail | cart | confirm | giftbox | card | delivery | mypage | contact | tokutei
      const [selectedId, setSelectedId] = useState(null);
      const [cart, setCart] = useState([]);
      const [theme, setTheme] = useState(TWEAK_DEFAULTS.theme || 'luxe');
      const [toast, setToast] = useState(null);

      // apply theme
      useEffect(() => {
        applyTheme(theme);
      }, [theme]);

      // restore persisted page
      useEffect(() => {
        const savedPage = localStorage.getItem('oimoya-page');
        const savedCart = localStorage.getItem('oimoya-cart');
        const savedSel = localStorage.getItem('oimoya-selected');
        if (savedPage) setPage(savedPage);
        if (savedCart) try { setCart(JSON.parse(savedCart)); } catch(e){}
        if (savedSel) setSelectedId(savedSel);
      }, []);

      useEffect(() => { localStorage.setItem('oimoya-page', page); }, [page]);
      useEffect(() => { localStorage.setItem('oimoya-cart', JSON.stringify(cart)); }, [cart]);
      useEffect(() => { if (selectedId) localStorage.setItem('oimoya-selected', selectedId); }, [selectedId]);

      // Scroll to top on page change
      useEffect(() => { window.scrollTo(0,0); }, [page]);

      // ====== Edit mode bridge ======
      useEffect(() => {
        const handler = (ev) => {
          const d = ev.data || {};
          if (d.type === '__activate_edit_mode') {
            document.getElementById('tweaks-panel').classList.add('active');
          } else if (d.type === '__deactivate_edit_mode') {
            document.getElementById('tweaks-panel').classList.remove('active');
          }
        };
        window.addEventListener('message', handler);
        window.parent.postMessage({type:'__edit_mode_available'}, '*');

        // wire theme buttons
        const panel = document.getElementById('theme-options');
        const onClick = (e) => {
          const btn = e.target.closest('[data-theme]');
          if (!btn) return;
          const t = btn.dataset.theme;
          setTheme(t);
          panel.querySelectorAll('.tweak-option').forEach(el => el.classList.toggle('active', el === btn));
          window.parent.postMessage({type:'__edit_mode_set_keys', edits:{theme: t}}, '*');
        };
        panel.addEventListener('click', onClick);
        return () => {
          window.removeEventListener('message', handler);
          panel.removeEventListener('click', onClick);
        };
      }, []);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 2400);
      };

      const handleAdd = (item) => {
        const key = (it) => `${it.id}|${it.wrap}|${it.delivery}|${it.cardMessage}`;
        const idx = cart.findIndex(it => key(it) === key(item));
        if (idx >= 0) {
          const next = [...cart];
          next[idx] = { ...next[idx], qty: next[idx].qty + item.qty };
          setCart(next);
        } else {
          setCart([...cart, item]);
        }
        showToast('カートに追加しました');
      };

      const handleUpdateQty = (idx, qty) => {
        const next = [...cart];
        next[idx] = { ...next[idx], qty };
        setCart(next);
      };
      const handleRemove = (idx) => {
        setCart(cart.filter((_, i) => i !== idx));
      };

      const handleCheckout = () => {
        setPage('confirm');
      };
      const handleRestart = () => {
        setCart([]);
        setPage('list');
      };

      return (
        <>
          <Header page={page} cartCount={cart.length}
            onNav={(p) => setPage(p)}/>
          {page === 'list' && (
            <ListPage
              onSelect={(id) => { setSelectedId(id); setPage('detail'); }}
              onReadStory={() => setPage('florists')}
            />
          )}
          {page === 'florists' && (
            <FloristsPage onBack={() => setPage('list')}/>
          )}
          {page === 'giftbox' && (
            <GiftBoxPage/>
          )}
          {page === 'card' && (
            <CardPage/>
          )}
          {page === 'delivery' && (
            <DeliveryPage/>
          )}
          {page === 'detail' && (
            <DetailPage
              productId={selectedId}
              onAdd={handleAdd}
              onBack={() => setPage('list')}
              onGoCart={() => setPage('cart')}
            />
          )}
          {page === 'cart' && (
            <CartPage
              cart={cart}
              onUpdateQty={handleUpdateQty}
              onRemove={handleRemove}
              onCheckout={handleCheckout}
              onBack={() => setPage('list')}
            />
          )}
          {page === 'confirm' && (
            <ConfirmPage cart={cart} onBack={() => setPage('list')} onRestart={handleRestart}/>
          )}
          {page === 'mypage' && (
            <MyPage onBack={() => setPage('list')} onSelect={(id) => { setSelectedId(id); setPage('detail'); }}/>
          )}
          {page === 'contact' && (
            <ContactPage onBack={() => setPage('list')}/>
          )}
          {page === 'tokutei' && (
            <TokuteiPage onBack={() => setPage('list')}/>
          )}
          <Footer onNav={(p) => setPage(p)}/>

          {/* Toast */}
          {toast && (
            <div style={{
              position: 'fixed', bottom: 32, left: '50%', transform: 'translateX(-50%)',
              background: 'var(--fg)', color: 'var(--fg-inverse)',
              padding: '14px 24px', fontSize: 13, letterSpacing: '.1em',
              zIndex: 200, boxShadow: '0 20px 40px rgba(0,0,0,.2)',
            }}>
              {toast}
              {page !== 'cart' && (
                <button onClick={() => setPage('cart')} style={{
                  marginLeft: 20, background: 'transparent',
                  border: '1px solid var(--fg-inverse)',
                  color: 'var(--fg-inverse)', padding: '6px 12px',
                  fontSize: 11, letterSpacing: '.12em', cursor: 'pointer',
                  textTransform: 'uppercase',
                }}>
                  カートを見る
                </button>
              )}
            </div>
          )}
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App/>);
  </script>
</body>
</html>
